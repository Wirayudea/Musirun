<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Registrasi Musi Run 2025</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .form-control:focus, .form-select:focus {
      border-color: #86b7fe;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

              <!-- STEP 2 -->
              <div id="step-2" class="step" style="display:none;">
                <div class="row g-3">
                  <div class="col-12">
                    <h5>Pilih Metode Pembayaran</h5>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="payment_method" id="pm_va" value="va" checked>
                      <label class="form-check-label" for="pm_va">Virtual Account</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="payment_method" id="pm_qr" value="qr">
                      <label class="form-check-label" for="pm_qr">QR Code</label>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="border p-3">
                      <strong>Ringkasan Pesanan</strong>
                      <div id="orderSummary" class="mt-2 text-muted">- Belum ada pilihan jarak</div>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <div class="border p-3">
                      <strong>Detail Pembayaran</strong>
                      <div id="paymentDetails" class="mt-2 text-muted">Pilih metode pembayaran untuk melihat detail.</div>
                    </div>
                  </div>

                  <div class="col-12 d-flex justify-content-between mt-3">
                    <button type="button" class="btn btn-outline-secondary" onclick="prevStep(2)">Kembali</button>
                    <button type="button" class="btn btn-primary" onclick="nextStep(2)">Lihat Ringkasan & Konfirmasi</button>
                  </div>
                </div>
              </div>

              <!-- STEP 3 -->
              <div id="step-3" class="step" style="display:none;">
                <div class="row g-3">
                  <div class="col-12">
                    <h5>Konfirmasi & Pembayaran</h5>
                    <div id="reviewArea" class="border p-3 text-muted">Menunggu ringkasan...</div>
                  </div>

                  <div class="col-12 d-flex justify-content-between align-items-center mt-3">
                    <button type="button" class="btn btn-outline-secondary" onclick="prevStep(3)">Kembali</button>
                    <div>
                      <button type="button" class="btn btn-success me-2" id="btnBayarSekarang" onclick="payNow()">Bayar Sekarang</button>
                      <button type="submit" class="btn btn-primary" id="btnSubmitForm" style="display:none;">Simpan & Kirim Pendaftaran</button>
                    </div>
                  </div>

                  <div class="col-12">
                    <div id="paymentResult" style="display:none; margin-top:12px;">
                      <h6>Order ID: <span id="orderIdText"></span></h6>
                      <div id="qrContainer" style="margin-top:10px"></div>
                    </div>
                  </div>
                </div>
              </div>

            </form>
          </div>

          <script>
          // kategori data
          const kategoriJarak = [
            { nama: '5 Kilometer', earlyBird:{start:'2025-10-01',end:'2025-12-09',hargaNormal:200000,hargaDiskon:170000}, normal:{start:'2025-12-10',end:'2026-01-10',hargaNormal:200000} },
            { nama: '10 Kilometer', earlyBird:{start:'2025-10-01',end:'2025-12-09',hargaNormal:230000,hargaDiskon:210000}, normal:{start:'2025-12-10',end:'2026-01-10',hargaNormal:230000} }
          ];

          // render kategori
          (function renderKategori(){
            const container = document.getElementById('kategoriJarakContainer');
            const today = new Date();
            kategoriJarak.forEach(k=>{
              const earlyStart=new Date(k.earlyBird.start), earlyEnd=new Date(k.earlyBird.end);
              const normalStart=new Date(k.normal.start), normalEnd=new Date(k.normal.end);
              const isEarly = today>=earlyStart && today<=earlyEnd;
              const isNormal = today>=normalStart && today<=normalEnd;
              const earlyHtml = `<div class="col-md-6"><label class="jarak-card ${!isEarly?'disabled-card':''}"><input type="radio" name="kategori_jarak" value="${k.nama}_Early" ${!isEarly?'disabled':''}> <div class="jarak-content"><strong>${k.nama} Early Bird</strong><div class="text-muted">${isEarly?('Diskon '+(k.earlyBird.hargaDiskon).toLocaleString()):''}</div></div></label></div>`;
              const normalHtml = `<div class="col-md-6"><label class="jarak-card ${!isNormal?'disabled-card':''}"><input type="radio" name="kategori_jarak" value="${k.nama}_Normal" ${!isNormal?'disabled':''}> <div class="jarak-content"><strong>${k.nama} Normal</strong><div class="text-muted">Rp ${(k.normal.hargaNormal).toLocaleString()}</div></div></label></div>`;
              container.insertAdjacentHTML('beforeend', earlyHtml+normalHtml);
            });
            // click handling
            document.addEventListener('click', e=>{
              const card = e.target.closest('.jarak-card');
              if(!card || card.classList.contains('disabled-card')) return;
              document.querySelectorAll('.jarak-card').forEach(c=>c.classList.remove('active'));
              card.classList.add('active');
              const input = card.querySelector('input[type="radio"]'); if(input) input.checked=true;
            });
          })();

          // step nav
          let current=1;
          function updateProgress(){ document.getElementById('currentStep').textContent=current; document.getElementById('progressBar').style.width=(current/3*100)+'%'; const labels=['Isi Data Diri','Pembayaran','Konfirmasi']; document.getElementById('stepLabel').textContent=labels[current-1]; }
          function showStep(n){ for(let i=1;i<=3;i++){ const el=document.getElementById('step-'+i); if(el) el.style.display = (i===n)?'':'none'; } }
          function nextStep(from){ if(from===1){ const required=['name','nik','email','dob','phone','jersey_size']; for(let id of required){ const el=document.getElementById(id); if(!el||!el.value){ el&&el.focus(); alert('Lengkapi semua data diri terlebih dahulu.'); return; } } const kategori=document.querySelector('input[name="kategori_jarak"]:checked'); if(!kategori){ alert('Pilih kategori jarak.'); return; } }
            if(current<3) current++; showStep(current); updateProgress(); if(current===2) populateOrderSummary(); if(current===3) populateReview(); }
          function prevStep(){ if(current>1) current--; showStep(current); updateProgress(); }

          function getSelectedCategory(){ const sel=document.querySelector('input[name="kategori_jarak"]:checked'); return sel?sel.value:null; }
          function formatRupiah(n){ return 'Rp '+Number(n).toLocaleString('id-ID'); }
          function populateOrderSummary(){ const sel=getSelectedCategory(); const el=document.getElementById('orderSummary'); if(!sel){ el.innerHTML='- Belum ada pilihan jarak'; return; } const parts=sel.split('_'); const nama=parts[0], tipe=parts[1]; let price=0; for(let k of kategoriJarak){ if(k.nama===nama){ price = (tipe==='Early') ? (k.earlyBird.hargaDiskon||k.earlyBird.hargaNormal) : k.normal.hargaNormal; } } el.innerHTML=`<div>${nama} — <strong>${tipe}</strong></div><div class="mt-2">Total: <strong>${formatRupiah(price)}</strong></div>`; }

          function populatePaymentDetails(){ const method=(document.querySelector('input[name="payment_method"]:checked')||{}).value||'va'; const details=document.getElementById('paymentDetails'); details.innerHTML = method==='va' ? 'Virtual Account: nomor VA muncul setelah klik Bayar Sekarang.' : 'QR Payment: QR akan muncul setelah klik Bayar Sekarang.'; }
          document.addEventListener('change', e=>{ if(e.target && e.target.name==='payment_method') populatePaymentDetails(); });

          function populateReview(){ const review=document.getElementById('reviewArea'); const name=document.getElementById('name').value; const email=document.getElementById('email').value; const phone=document.getElementById('phone').value; const method=(document.querySelector('input[name="payment_method"]:checked')||{}).value||'va'; const methodLabel = method==='va'?'Virtual Account':'QR Code'; let priceText = document.getElementById('orderSummary').innerHTML; review.innerHTML=`<p><strong>Nama:</strong> ${name}<br><strong>Email:</strong> ${email}<br><strong>HP:</strong> ${phone}</p><p><strong>Metode Pembayaran:</strong> ${methodLabel}</p><div><strong>Ringkasan:</strong><br>${priceText}</div>`; }

          function createOrderId(){ return 'ORD'+Date.now(); }
          function payNow(){ const orderId=createOrderId(); document.getElementById('orderIdText').textContent=orderId; const method=(document.querySelector('input[name="payment_method"]:checked')||{}).value||'va'; const payload=`${orderId}|method:${method}|summary:${document.getElementById('orderSummary').textContent.trim()}`; const qrUrl='https://chart.googleapis.com/chart?cht=qr&chs=250x250&chl='+encodeURIComponent(payload); document.getElementById('qrContainer').innerHTML=`<img src="${qrUrl}" alt="QR Pembayaran">`; document.getElementById('paymentResult').style.display=''; document.getElementById('btnSubmitForm').style.display=''; document.getElementById('btnBayarSekarang').style.display='none'; document.getElementById('paymentResult').scrollIntoView({behavior:'smooth'}); }

          // init
          updateProgress(); populatePaymentDetails(); showStep(1);

          // small validate on submit
          document.getElementById('registrasiForm').addEventListener('submit', function(e){ const sel=getSelectedCategory(); if(!sel){ e.preventDefault(); alert('Silahkan pilih kategori jarak terlebih dahulu'); document.getElementById('kategoriJarakContainer').scrollIntoView({behavior:'smooth'}); } });
          </script>
        </body>
        </html>
