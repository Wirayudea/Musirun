      <script>
      // Step navigation
      let current = 1;
      function updateProgress() {
        document.getElementById('currentStep').textContent = current;
        document.getElementById('progressBar').style.width = (current/3*100) + '%';
        const labels = ['Isi Data Diri','Pembayaran','Konfirmasi'];
        document.getElementById('stepLabel').textContent = labels[current-1];
      }

      function nextStep(from) {
        if (from === 1) {
          // validate required fields in step 1
          const required = ['name','nik','email','dob','phone','jersey_size'];
          for (let id of required) {
            const el = document.getElementById(id);
            if (!el || !el.value) {
              el && el.focus();
              alert('Lengkapi semua data diri terlebih dahulu.');
              return;
            }
          }
          // kategori jarak
          const kategori = document.querySelector('input[name="kategori_jarak"]:checked');
          if (!kategori) {
            alert('Pilih kategori jarak.');
            return;
          }
        }

        if (current < 3) current++;
        showStep(current);
        updateProgress();
        if (current === 2) populateOrderSummary();
        if (current === 3) populateReview();
      }

      function prevStep(from) {
        if (current > 1) current--;
        showStep(current);
        updateProgress();
      }

      function showStep(n) {
        for (let i=1;i<=3;i++) {
          const el = document.getElementById('step-'+i);
          if (el) el.style.display = (i===n) ? '' : 'none';
        }
      }

      // Order summary
      function getSelectedCategory() {
        const sel = document.querySelector('input[name="kategori_jarak"]:checked');
        if (!sel) return null;
        return sel.value; // e.g. "5 Kilometer_Early"
      }

      function formatRupiah(n) {
        return 'Rp ' + Number(n).toLocaleString('id-ID');
      }

      function populateOrderSummary() {
        const sel = getSelectedCategory();
        const el = document.getElementById('orderSummary');
        if (!sel) { el.innerHTML = '- Belum ada pilihan jarak'; return; }
        const parts = sel.split('_');
        const nama = parts[0];
        const tipe = parts[1];
        // find price from kategoriJarak array
        let price = 0;
        for (let k of kategoriJarak) {
          if (k.nama === nama) {
            if (tipe === 'Early') price = k.earlyBird.hargaDiskon || k.earlyBird.hargaNormal;
            else price = k.normal.hargaNormal;
          }
        }
        el.innerHTML = `<div>${nama} — <strong>${tipe}</strong></div><div class="mt-2">Total: <strong>${formatRupiah(price)}</strong></div>`;
        // save to hidden input? we'll keep in JS when creating order
      }

      function populatePaymentDetails() {
        const method = document.querySelector('input[name="payment_method"]:checked').value;
        const details = document.getElementById('paymentDetails');
        if (method === 'va') {
          details.innerHTML = 'Virtual Account: Transfer ke nomor VA akan muncul setelah klik Bayar Sekarang.';
        } else {
          details.innerHTML = 'QR Payment: Akan menampilkan QR untuk dipindai ketika klik Bayar Sekarang.';
        }
      }

      document.addEventListener('change', function(e){
        if (e.target && e.target.name === 'payment_method') populatePaymentDetails();
      });

      function populateReview() {
        const review = document.getElementById('reviewArea');
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const kategori = getSelectedCategory() || '-';
        const method = document.querySelector('input[name="payment_method"]:checked').value;
        const methodLabel = method === 'va' ? 'Virtual Account' : 'QR Code';
        // get price same as populateOrderSummary
        let priceText = document.getElementById('orderSummary').innerHTML;
        review.innerHTML = `<p><strong>Nama:</strong> ${name}<br><strong>Email:</strong> ${email}<br><strong>HP:</strong> ${phone}</p><p><strong>Metode Pembayaran:</strong> ${methodLabel}</p><div><strong>Ringkasan:</strong><br>${priceText}</div>`;
      }

      // Simulate payment: generate ORD and QR
      function createOrderId() {
        return 'ORD' + Date.now();
      }

      function payNow() {
        // prepare order data
        const orderId = createOrderId();
        document.getElementById('orderIdText').textContent = orderId;
        // decide QR payload (simple)
        const method = document.querySelector('input[name="payment_method"]:checked').value;
        const summaryEl = document.getElementById('orderSummary');
        const payload = `${orderId}|method:${method}|summary:${summaryEl.textContent.trim()}`;
        // generate QR via Google Chart API
        const qrUrl = 'https://chart.googleapis.com/chart?cht=qr&chs=250x250&chl=' + encodeURIComponent(payload);
        document.getElementById('qrContainer').innerHTML = `<img src="${qrUrl}" alt="QR Pembayaran">`;
        document.getElementById('paymentResult').style.display = '';
        // show submit button to finalize
        document.getElementById('btnSubmitForm').style.display = '';
        document.getElementById('btnBayarSekarang').style.display = 'none';
        // Scroll to payment result
        document.getElementById('paymentResult').scrollIntoView({behavior:'smooth'});
      }

      // Initialize
      updateProgress();
      populatePaymentDetails();

      // keep original validateForm but allow final submit only when kategori selected
      function validateForm() {
        const kategoriJarak = document.querySelector('input[name="kategori_jarak"]:checked');
        if (!kategoriJarak) {
          alert('Silahkan pilih kategori jarak terlebih dahulu');
          return false;
        }
        return true;
      }
      </script>

      <script>
  const kategoriJarak = [
    {
      nama: "5 Kilometer",
      earlyBird: { start: "2025-10-01", end: "2025-12-09", hargaNormal: 200000, hargaDiskon: 170000 },
      normal: { start: "2025-12-10", end: "2026-01-10", hargaNormal: 200000 }
    },
    {
      nama: "10 Kilometer",
      earlyBird: { start: "2025-10-01", end: "2025-12-09", hargaNormal: 230000, hargaDiskon: 210000 },
      normal: { start: "2025-12-10", end: "2026-01-10", hargaNormal: 230000 }
    }
  ];

  const container = document.getElementById("kategoriJarakContainer");
  const today = new Date();

  kategoriJarak.forEach((k) => {
    const earlyStart = new Date(k.earlyBird.start);
    const earlyEnd = new Date(k.earlyBird.end);
    const normalStart = new Date(k.normal.start);
    const normalEnd = new Date(k.normal.end);

    const isEarlyActive = today >= earlyStart && today <= earlyEnd;
    const isNormalActive = today >= normalStart && today <= normalEnd;

    const html = `
      <div class="col-md-6">
        <label class="jarak-card ${!isEarlyActive ? 'disabled-card' : ''}">
          <input type="radio" name="kategori_jarak" value="${k.nama}_Early" ${!isEarlyActive ? 'disabled' : ''}>
          <div class="jarak-content">
            <h6 class="fw-bold">${k.nama} <span class="badge bg-warning text-dark">Early Bird</span></h6>
            <p class="text-muted small mb-1">${new Date(k.earlyBird.start).toLocaleDateString('id-ID')} - ${new Date(k.earlyBird.end).toLocaleDateString('id-ID')}</p>
            <p class="mb-0"><s>Rp ${k.earlyBird.hargaNormal.toLocaleString('id-ID')}</s> <span class="text-success fw-bold">Rp ${k.earlyBird.hargaDiskon.toLocaleString('id-ID')}</span></p>
          </div>
        </label>
      </div>

      <div class="col-md-6">
        <label class="jarak-card ${!isNormalActive ? 'disabled-card' : ''}">
          <input type="radio" name="kategori_jarak" value="${k.nama}_Normal" ${!isNormalActive ? 'disabled' : ''}>
          <div class="jarak-content">
            <h6 class="fw-bold">${k.nama} <span class="badge bg-secondary">Normal</span></h6>
            <p class="text-muted small mb-1">${new Date(k.normal.start).toLocaleDateString('id-ID')} - ${new Date(k.normal.end).toLocaleDateString('id-ID')}</p>
            <p class="mb-0 text-light fw-bold">Rp ${k.normal.hargaNormal.toLocaleString('id-ID')}</p>
          </div>
        </label>
      </div>
    `;
    container.insertAdjacentHTML('beforeend', html);
  });

  // Hanya aktif jika diklik manual
  document.addEventListener("click", function (e) {
    const card = e.target.closest(".jarak-card");
    if (card && !card.classList.contains("disabled-card")) {
      document.querySelectorAll(".jarak-card").forEach(c => c.classList.remove("active"));
      card.classList.add("active");
      const input = card.querySelector('input[type="radio"]');
      if (input) input.checked = true; // baru dicentang kalau diklik
    }
  });
</script>
